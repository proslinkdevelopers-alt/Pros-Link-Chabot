# =============================================================================
#  Pros-Link platform — local / production compose stack
#
#  Usage:
#    cp .env.example .env   # then set the secrets, including POSTGRES_PASSWORD
#    docker compose up -d --build
#    docker compose exec web npx prisma migrate deploy
#    docker compose exec web npm run db:seed
# =============================================================================

services:
  db:
    image: postgres:16-alpine
    container_name: proslink-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-proslink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-proslink}
    volumes:
      - proslink_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-proslink}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proslink-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - proslink_redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proslink-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-proslink}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-proslink}?schema=public
      REDIS_URL: redis://redis:6379
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  proslink_pgdata:
  proslink_redisdata:
